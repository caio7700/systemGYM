<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <title>Ficha de Treino - SystemGym</title>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div th:replace="~{admin/fragments :: cabecalho}"></div>
    </nav>
    <main class="container mt-5">
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Montar Treino: <span th:text="${aluno.nome}"></span></h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/treino/salvar}" th:object="${novoTreino}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{aluno.id}">

                    <div class="col-md-4">
                        <label class="form-label">Exercício (Catálogo)</label>
                        <select th:field="*{exercicio.id}" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="e : ${listaExercicios}" th:value="${e.id}"
                                th:text="${e.nome} + ' (' + ${e.grupoMuscular} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Séries</label>
                        <input type="text" th:field="*{series}" class="form-control" placeholder="Ex: 3" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Repetições</label>
                        <input type="text" th:field="*{repeticoes}" class="form-control" placeholder="Ex: 12" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Carga</label>
                        <input type="text" th:field="*{carga}" class="form-control" placeholder="Ex: 10kg">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Adicionar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Exercício</th>
                            <th>Grupo</th>
                            <th>Séries</th>
                            <th>Repetições</th>
                            <th>Carga</th>
                            <th class="text-center">Ações</th>
                            <th><a th:href="@{/admin/treino/aluno/{id}/imprimir(id=${aluno.id})}" class="btn btn-dark">
                                    <i class="bi bi-printer"></i> Imprimir Ficha PDF
                                </a></td>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${treinos}">
                            <td th:text="${t.exercicio.nome}"></td>
                            <td th:text="${t.exercicio.grupoMuscular}"></td>
                            <td th:text="${t.series}"></td>
                            <td th:text="${t.repeticoes}"></td>
                            <td th:text="${t.carga}"></td>
                            <td class="text-center">
                                <form th:action="@{/admin/treino/excluir/{id}(id=${t.id})}" method="post"
                                    onsubmit="return confirm('Tem certeza que deseja remover este exercício da ficha?');">
                                    <input type="hidden" name="alunoId" th:value="${aluno.id}" />
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash"></i> Excluir
                                    </button>
                                </form>
                            </td>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
