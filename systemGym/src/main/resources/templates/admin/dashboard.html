<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <title>Dashboard - SystemGym</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div th:replace="~{admin/fragments :: cabecalho}"></div>
    </nav>

    <main class="container">
        <h2 class="mb-4">Painel de Controle</h2>
        
        <div class="row text-white">
            <div class="col-md-4 mb-4">
                <div class="card bg-primary shadow">
                    <div class="card-body">
                        <h5 class="card-title">Alunos</h5>
                        <h2 th:text="${totalAlunos}">0</h2>
                        <a th:href="@{/admin/aluno/lista}" class="text-white small text-decoration-none">Ver todos →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card bg-success shadow">
                    <div class="card-body">
                        <h5 class="card-title">Funcionários</h5>
                        <h2 th:text="${totalFuncionarios}">0</h2>
                        <a th:href="@{/admin/funcionario/lista}" class="text-white small text-decoration-none">Ver quadro →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card bg-dark shadow border-warning">
                    <div class="card-body">
                        <h5 class="card-title text-warning">Faturamento Total</h5>
                        <h2 th:text="'R$ ' + ${faturamentoTotal}">R$ 0,00</h2>
                        <a th:href="@{/admin/pagamento/extrato}" class="text-warning small text-decoration-none">Ver extrato →</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">Ações Rápidas</div>
                    <div class="card-body d-flex gap-3">
                        <a th:href="@{/admin/plano/lista}" class="btn btn-outline-secondary">Gerenciar Planos</a>
                        <a th:href="@{/admin/aluno/novo}" class="btn btn-outline-primary">+ Novo Aluno</a>
                        <a th:href="@{/admin/funcionario/novo}" class="btn btn-outline-success">+ Novo Funcionário</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
