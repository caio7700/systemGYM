<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastro de Funcionário - SystemGym</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div th:replace="~{admin/fragments :: cabecalho}"></div>
    </nav>
    <main class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 800px;">
            <h2 class="text-center mb-4" th:text="${funcionario.id == null} ? 'Novo Funcionário' : 'Editar Funcionário'"></h2>
            
            <form th:action="@{/admin/funcionario/salvar}" th:object="${funcionario}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" th:field="*{nome}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">CPF</label>
                        <input type="text" th:field="*{cpf}" class="form-control" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cargo</label>
                        <select th:field="*{cargo}" class="form-select" required>
                            <option value="Instrutor">Instrutor</option>
                            <option value="Recepcionista">Recepcionista</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Limpeza">Auxiliar de Limpeza</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option th:each="s : ${T(com.systemgym.systemgym.entity.StatusFuncionario).values()}" 
                                    th:value="${s}" th:text="${s.descricao}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Salário (R$)</label>
                        <input type="number" step="0.01" th:field="*{salario}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Data de Admissão</label>
                        <input type="date" th:field="*{dataAdmissao}" class="form-control" required>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Salvar Funcionário</button>
                    <a th:href="@{/admin/funcionario/lista}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
