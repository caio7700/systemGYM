<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Lista de Funcionários - SystemGym</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div th:replace="~{admin/fragments :: cabecalho}"></div>
    </nav>
    <main class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Quadro de Funcionários</h3>
                <a th:href="@{/admin/funcionario/novo}" class="btn btn-success btn-sm">Novo Funcionário</a>
            </div>
            <div class="card-body">
                <table class="table table-hover text-center">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Salário</th>
                            <th>Admissão</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${funcionarios}">
                            <td th:text="${f.nome}"></td>
                            <td th:text="${f.cargo}"></td>
                            <td th:text="'R$ ' + ${f.salario}"></td>
                            <td th:text="${#temporals.format(f.dataAdmissao, 'dd/MM/yyyy')}"></td>
                            <td>
                                <span th:text="${f.status.descricao}" 
                                      th:class="${f.status.name() == 'ATIVO'} ? 'badge bg-success' : 'badge bg-secondary'">
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/admin/funcionario/editar/{id}(id=${f.id})}" class="btn btn-warning btn-sm">Editar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer">
                <a th:href="@{/admin/aluno/lista}" class="btn btn-link text-decoration-none">← Voltar para Alunos</a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
